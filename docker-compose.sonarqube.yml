services:
  sonarqube-db:
    image: postgres:16-alpine
    container_name: sonarqube-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${SONARQUBE_DB_NAME:-sonarqube}
      POSTGRES_USER: ${SONARQUBE_DB_USER:-sonarqube}
      POSTGRES_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${SONARQUBE_DB_USER:-sonarqube} -d ${SONARQUBE_DB_NAME:-sonarqube}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sonarqube:
    image: sonarqube:26.1.0.118079-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/${SONARQUBE_DB_NAME:-sonarqube}
      SONAR_JDBC_USERNAME: ${SONARQUBE_DB_USER:-sonarqube}
      SONAR_JDBC_PASSWORD: ${SONARQUBE_DB_PASSWORD:-sonarqube}
    volumes:
      - sonarqube_lta_data:/opt/sonarqube/data
      - sonarqube_lta_extensions:/opt/sonarqube/extensions
      - sonarqube_lta_logs:/opt/sonarqube/logs

volumes:
  sonarqube-postgres-data:
  sonarqube_lta_data:
  sonarqube_lta_extensions:
  sonarqube_lta_logs:
